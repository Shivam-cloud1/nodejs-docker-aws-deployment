AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API Gateway invokes Lambda directly; a shared public ALB routes to Lambda and EC2.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-00cf7ebffd8272b25
    Description: Existing default VPC used by the shared ALB.
  AlbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-07011322390e222ba,subnet-095b2a23a92741454
    Description: Two subnets in different Availability Zones in the selected VPC.

Resources:
  ItemsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CartTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cartId
          AttributeType: S
        - AttributeName: itemKey
          AttributeType: S
      KeySchema:
        - AttributeName: cartId
          KeyType: HASH
        - AttributeName: itemKey
          KeyType: RANGE

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
          CART_TABLE_NAME: !Ref CartTable
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt CartTable.Arn
              - !GetAtt OrdersTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: nodejs22-v1

  SharedAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP to the ALB listener.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  SharedApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref AlbSubnetIds
      SecurityGroups:
        - !GetAtt SharedAlbSecurityGroup.GroupId

  ItemsAlbInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ItemsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${AWS::StackName}-items-lambda/*"

  SharedItemsAlbInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ItemsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${AWS::StackName}-items-shared/*"

  SharedItemsAlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: SharedItemsAlbInvokePermission
    Properties:
      Name: !Sub "${AWS::StackName}-items-shared"
      TargetType: lambda
      HealthCheckEnabled: false
      Targets:
        - Id: !GetAtt ItemsFunction.Arn

  SharedApplicationLoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SharedApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SharedItemsAlbTargetGroup
  # The EC2 stack adds a path rule to this listener for /ec2/*.

  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ItemsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ItemsApi}/*"

  ApiGatewayLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ItemsApi
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ItemsFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiGatewayAlbRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: ApiGatewayLambdaPermission
    Properties:
      ApiId: !Ref ItemsApi
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiGatewayLambdaIntegration}"

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API.
    Value: !Sub "https://${ItemsApi}.execute-api.${AWS::Region}.amazonaws.com"
  AlbDnsName:
    Description: Public DNS name of the shared Application Load Balancer.
    Value: !GetAtt SharedApplicationLoadBalancer.DNSName
  ItemsTableName:
    Description: DynamoDB table storing API items.
    Value: !Ref ItemsTable
  CartTableName:
    Description: DynamoDB table storing cart metadata and line items.
    Value: !Ref CartTable
  OrdersTableName:
    Description: DynamoDB table storing simulated checkout orders.
    Value: !Ref OrdersTable
