AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API Gateway routes through a private ALB to a Lambda container image.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-00cf7ebffd8272b25
    Description: Existing default VPC used by the private ALB and API Gateway VPC Link.
  VpcCidr:
    Type: String
    Default: 172.31.0.0/16
    Description: CIDR block used to limit VPC Link outbound traffic to the VPC.
  AlbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-07011322390e222ba,subnet-095b2a23a92741454
    Description: Two subnets in different Availability Zones in the selected VPC.

Resources:
  ItemsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CartTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cartId
          AttributeType: S
        - AttributeName: itemKey
          AttributeType: S
      KeySchema:
        - AttributeName: cartId
          KeyType: HASH
        - AttributeName: itemKey
          KeyType: RANGE

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
          CART_TABLE_NAME: !Ref CartTable
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt CartTable.Arn
              - !GetAtt OrdersTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: nodejs22-v1

  ApiVpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow API Gateway VPC Link traffic to the internal ALB.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr

  ApplicationLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only from the API Gateway VPC Link.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !GetAtt ApiVpcLinkSecurityGroup.GroupId

  ApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub "${AWS::StackName}-vpc-link"
      SubnetIds: !Ref AlbSubnetIds
      SecurityGroupIds:
        - !GetAtt ApiVpcLinkSecurityGroup.GroupId

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref AlbSubnetIds
      SecurityGroups:
        - !GetAtt ApplicationLoadBalancerSecurityGroup.GroupId

  ItemsAlbInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ItemsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${AWS::StackName}-items-lambda/*"

  ItemsAlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: ItemsAlbInvokePermission
    Properties:
      Name: !Sub "${AWS::StackName}-items-lambda"
      TargetType: lambda
      HealthCheckEnabled: false
      Targets:
        - Id: !GetAtt ItemsFunction.Arn

  ApplicationLoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ItemsAlbTargetGroup

  ApiGatewayAlbIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ItemsApi
      ConnectionId: !Ref ApiVpcLink
      ConnectionType: VPC_LINK
      IntegrationMethod: ANY
      IntegrationType: HTTP_PROXY
      IntegrationUri: !Ref ApplicationLoadBalancerListener
      PayloadFormatVersion: "1.0"
      RequestParameters:
        "overwrite:path": "$request.path"

  ApiGatewayAlbRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ItemsApi
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiGatewayAlbIntegration}"

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API.
    Value: !Sub "https://${ItemsApi}.execute-api.${AWS::Region}.amazonaws.com"
  AlbDnsName:
    Description: Private DNS name of the internal Application Load Balancer.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ApiVpcLinkId:
    Description: API Gateway VPC Link connecting to the internal ALB.
    Value: !Ref ApiVpcLink
  ItemsTableName:
    Description: DynamoDB table storing API items.
    Value: !Ref ItemsTable
  CartTableName:
    Description: DynamoDB table storing cart metadata and line items.
    Value: !Ref CartTable
  OrdersTableName:
    Description: DynamoDB table storing simulated checkout orders.
    Value: !Ref OrdersTable
