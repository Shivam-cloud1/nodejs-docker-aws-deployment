AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CRUD HTTP API using a Lambda container image and DynamoDB.

Resources:
  ItemsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CartTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cartId
          AttributeType: S
        - AttributeName: itemKey
          AttributeType: S
      KeySchema:
        - AttributeName: cartId
          KeyType: HASH
        - AttributeName: itemKey
          KeyType: RANGE

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
          CART_TABLE_NAME: !Ref CartTable
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt CartTable.Arn
              - !GetAtt OrdersTable.Arn
      Events:
        ItemsRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ItemsApi
            Path: /items
            Method: ANY
        ItemsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ItemsApi
            Path: /items/{proxy+}
            Method: ANY
        CartRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ItemsApi
            Path: /cart
            Method: ANY
        CartProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ItemsApi
            Path: /cart/{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: nodejs22-v1

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API.
    Value: !Sub "https://${ItemsApi}.execute-api.${AWS::Region}.amazonaws.com"
  ItemsTableName:
    Description: DynamoDB table storing API items.
    Value: !Ref ItemsTable
  CartTableName:
    Description: DynamoDB table storing cart metadata and line items.
    Value: !Ref CartTable
  OrdersTableName:
    Description: DynamoDB table storing simulated checkout orders.
    Value: !Ref OrdersTable
